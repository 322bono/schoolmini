<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>스쿨 미니 — 친구들과 미니게임 한판!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E✏️%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 연필 보일링용 SVG 필터 (씨앗값만 다른 3장을 번갈아 적용) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="boil0" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="2" seed="3" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" />
      </filter>
      <filter id="boil1" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.021 0.027" numOctaves="2" seed="11" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" />
      </filter>
      <filter id="boil2" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.016 0.032" numOctaves="2" seed="27" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" />
      </filter>
    </defs>
  </svg>

  <button id="btnMute" class="icon-btn" title="소리 켜기/끄기">🔊</button>
  <div id="toast-wrap"></div>

  <div id="app">
    <!-- ── 홈 ── -->
    <section id="scr-home" class="screen active">
      <span class="home-doodle" style="top:14%; left:12%">✦</span>
      <span class="home-doodle" style="top:22%; right:14%; animation-delay:.8s">★</span>
      <span class="home-doodle" style="bottom:20%; left:18%; animation-delay:1.4s">✏️</span>
      <span class="home-doodle" style="bottom:26%; right:12%; animation-delay:.4s">✦</span>
      <div style="text-align:center">
        <h1 class="home-title boil">스쿨 미니</h1>
        <svg class="title-underline boil2" viewBox="0 0 400 18" aria-hidden="true">
          <path d="M6 10 C 60 4, 120 14, 200 9 S 340 6, 394 11" />
        </svg>
        <p class="home-sub">쉬는시간 10분, 친구들과 미니게임 한판!</p>
      </div>
      <div id="homeMascot"></div>
      <div class="menu-btns">
        <button id="btnGoCreate" class="btn btn-lg btn-red boil">게임 만들기</button>
        <button id="btnGoJoin" class="btn btn-lg btn-blue boil2">게임 참가하기</button>
      </div>
      <div class="home-foot">최대 20명 · 같은 코드로 접속하면 함께 플레이!</div>
    </section>

    <!-- ── 만들기 / 참가 ── -->
    <section id="scr-entry" class="screen">
      <div class="panel sketch boil">
        <h2 id="entryTitle">게임 만들기</h2>
        <p class="hint" id="entryHint">친구들에게 보여줄 닉네임을 정해줘!</p>
        <input id="inpNick" class="sketch-input" maxlength="8" placeholder="닉네임 (8자까지)" autocomplete="off" />
        <input id="inpCode" class="sketch-input code" maxlength="4" placeholder="방 코드" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" style="display:none" />
        <div class="panel-row">
          <button id="btnEntryBack" class="btn">← 뒤로</button>
          <button id="btnEntryGo" class="btn btn-red">만들기!</button>
        </div>
      </div>
    </section>

    <!-- ── 로비 ── -->
    <section id="scr-lobby" class="screen">
      <div class="lobby-head">
        <span class="lbl">방 코드</span>
        <button id="roomCodeChip" class="room-code-chip sketch alt" title="눌러서 복사">----</button>
        <span class="lbl">친구들에게 알려줘!</span>
        <span class="lobby-count sketch hud-chip" id="lobbyCount">1/20</span>
      </div>
      <div class="playground sketch alt2" id="playground">
        <span class="playground-hint">캐릭터들이 놀고 있어요…</span>
      </div>
      <div class="lobby-bottom">
        <div class="colors-panel sketch">
          <div class="panel-title">✏️ 내 색깔 고르기 (누르면 바뀜!)</div>
          <div class="color-grid" id="colorGrid"></div>
        </div>
        <div class="players-panel sketch alt">
          <div class="panel-title">📋 플레이어 목록</div>
          <div id="playerList"></div>
        </div>
        <div class="lobby-actions">
          <div id="hostControls" style="display:none; flex-direction:column; gap:.55rem">
            <div class="stepper-lbl">몇 판 할까?</div>
            <div class="stepper sketch alt2" style="padding:.25rem .4rem">
              <button id="btnRoundMinus" class="btn btn-sm">−</button>
              <span class="val" id="roundsVal">4</span>
              <button id="btnRoundPlus" class="btn btn-sm">＋</button>
            </div>
            <button id="btnStart" class="btn btn-lg btn-red boil">START!</button>
          </div>
          <div id="guestNotice" class="wait-host sketch" style="padding:.6rem">방장이 시작하면<br />게임이 시작돼요!</div>
          <button id="btnLeaveLobby" class="btn btn-sm">방 나가기</button>
        </div>
      </div>
    </section>

    <!-- ── 게임 진행 ── -->
    <section id="scr-game" class="screen">
      <div class="hud">
        <span class="hud-chip sketch" id="hudRound">라운드 1/4</span>
        <div class="hud-timerwrap" id="hudTimerWrap"><div class="hud-timer-fill" id="hudTimerFill"></div></div>
        <span class="hud-sec" id="hudSec">60</span>
        <span class="hud-chip hud-code sketch alt" id="hudCode">----</span>
      </div>
      <div id="gameStage"></div>
      <div class="action-dock" id="actionDock"></div>

      <!-- 슬롯머신 -->
      <div class="ovl" id="ovl-slot">
        <div class="slot-box sketch boil">
          <div class="slot-title">이번 게임은 과연…?!</div>
          <div class="slot-window">
            <span class="slot-arrows left">▶</span>
            <span class="slot-arrows right">◀</span>
            <div class="slot-reel" id="slotReel"></div>
          </div>
        </div>
      </div>

      <!-- 게임 소개 -->
      <div class="ovl" id="ovl-intro">
        <div class="intro-card sketch boil">
          <div class="intro-name" id="introName">게임 이름</div>
          <div class="intro-tag" id="introTag">' 설명 '</div>
          <div class="intro-desc" id="introDesc"></div>
          <div class="intro-timer">곧 시작해요…</div>
        </div>
      </div>

      <!-- 라운드 결과 -->
      <div class="ovl" id="ovl-result">
        <div class="stamp-timeover" id="stampTimeover" style="display:none">시간 초과!!</div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-field" id="resultField"></div>
        <div class="result-score" id="resultScore"></div>
      </div>
    </section>

    <!-- ── 최종 리더보드 ── -->
    <section id="scr-final" class="screen">
      <h2 class="final-title boil">🏆 최종 랭킹!</h2>
      <div class="winner-banner sketch alt" id="winnerBanner"></div>
      <div class="podium-row" id="podiumRow"></div>
      <div class="brk-wrap sketch" id="brkWrap" style="display:none">
        <div class="panel-title">📝 게임별 점수표</div>
        <div class="brk-scroll" id="brkScroll"></div>
      </div>
      <div class="rank-list sketch" id="rankList"></div>
      <div class="final-actions">
        <button id="btnAgain" class="btn btn-lg btn-red boil" style="display:none">한 판 더!</button>
        <button id="btnFinalLeave" class="btn">홈으로</button>
      </div>
    </section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
